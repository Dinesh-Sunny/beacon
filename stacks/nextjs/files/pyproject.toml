# uv workspace root (not itself a package). Members live in python/*. Shared Python tooling config lives here.
[project]
name = "__NAME__"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]
exclude = ["python/__pycache__"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["python/*/src"]   # workspace members are first-party for import sorting
extend-exclude = ["apps", "packages", ".claude"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["python/*/src", "python/*/tests"]

# Ships no type information (no py.typed); our code around it is still checked strictly.
[[tool.mypy.overrides]]
module = ["ag_ui_langgraph", "ag_ui_langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["python"]
addopts = ["--import-mode=importlib", "-ra"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
]
