name: Something isn't working
description: Report a bug in Beacon
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't include anyone's real name, address or personal details.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page, device and browser
      placeholder: /check on iPhone Safari
