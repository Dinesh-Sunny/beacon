# Checks every push and pull request: types, rule packs and translations.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter meta typecheck
      - name: Rule packs (every line has a valid source)
        run: pnpm --filter meta packs:check
      - name: Translations (every language has every message)
        run: pnpm --filter meta i18n:check
