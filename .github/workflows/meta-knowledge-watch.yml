# Daily knowledge watch for the Meta app's rule pack. Checks the official pages behind every rule
# and opens a pull request when one changes, so updates are reviewed before they reach anyone.
name: meta knowledge watch

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: watch
        run: node scripts/watch-sources.ts
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: knowledge/watch
          commit-message: "chore(meta): knowledge watch"
          title: "Knowledge watch: official pages changed"
          body: |
            The daily knowledge watch found ${{ steps.watch.outputs.changed }} changed official page(s).
            Re-check the rules that cite them in `apps/meta/packs/*.json` before merging.
            See the run summary for the list.
          add-paths: apps/meta/catalog/sources/**
