# Daily knowledge watch for the Meta app's rule pack. Checks the official pages behind every rule
# and opens a pull request when one changes, so updates are reviewed before they reach anyone.
name: meta knowledge watch

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meta
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: watch
        run: node scripts/watch-sources.mjs --pack packs/uk-core.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: knowledge/uk-core
          commit-message: "chore(meta): knowledge watch for uk-core"
          title: "Knowledge watch: official pages changed for uk-core"
          body: |
            The daily knowledge watch found ${{ steps.watch.outputs.changed }} changed official page(s).
            Re-check the rules that cite them in `apps/meta/packs/uk-core.json` before merging.
            See the run summary for the list.
          add-paths: apps/meta/packs/*.sources.json
